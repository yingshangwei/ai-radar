[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-radar-server"
version = "0.1.0"
description = "A source-grounded personal AI intelligence service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "feedparser>=6.0,<7",
  "apscheduler>=3.11,<4",
  "openai>=1.68,<3",
  "anthropic>=0.49,<1",
  "beautifulsoup4>=4.13,<5",
  "trafilatura>=2.2,<3",
  "pypdf>=6.17,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "respx>=0.22", "ruff>=0.11"]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI dependency and Query declarations are intentional defaults.
