timezone = "Asia/Shanghai"
daily_hour = 8
daily_minute = 0
collect_minutes = 30
publish_priority_raw = true
x_head_refresh_minutes = 25
x_request_budget = 64
x_discovery_requests = 2
lookback_hours = 168
anthropic_news_enabled = true
official_news_sources = ["seed", "deepseek", "kimi", "minimax"]
min_engagement = 30
x_max_pages = 2
x_page_size = 100
x_watch_freshness_first = true
x_query = '(AI OR "artificial intelligence" OR LLM OR agents OR robotics) -is:retweet'
facebook_version = "v23.0"
facebook_page_ids = []

[x_data]
provider = "twitterapi_io"
api_key_env = "TWITTERAPI_IO_KEY"
monthly_usd = 8
daily_usd = 0.4
request_interval_seconds = 5.1
discovery_interval_minutes = 360
# Enable only after Apify authorization and account spending limits are verified.
shadow_enabled = false
shadow_monthly_usd = 2
shadow_daily_usd = 0.1
shadow_api_key_env = "APIFY_API_TOKEN"

[provider]
kind = "codex"
command = ["codex"]
# model = "your-authorized-model"
timeout_seconds = 240
max_items = 35
# Alternatives: claude_cli / command / openai / anthropic / extractive
# base_url = "https://api.openai.com/v1"
# api_key_env = "OPENAI_API_KEY"

[summary_review]
enabled = true
max_calls = 64
max_correction_rounds = 2
max_format_retries = 1
max_prompt_chars = 400000
# The independent reviewer uses [provider] unless explicitly overridden.
# Model-generated summaries stay private until review passes against saved originals.
# Explicit extractive mode remains a labelled offline excerpt, without AI review.
# [summary_review.provider]
# kind = "openai_chat"
# model = "your-review-model"
# base_url = "https://your-model-provider.example/v1"
# api_key_env = "SUMMARY_REVIEW_API_KEY"

[translation]
enabled = false
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key_env = "DASHSCOPE_API_KEY"
model = "qwen3.7-flash"
review_model = "qwen-plus"
request_options = { enable_thinking = false }
# Increase revision to explicitly regenerate cached translations after a policy change.
revision = "zh-v1"
concurrency = 1
factual_review_only = true
individual_parts = true
max_documents = 100
# Optional self-hosted LibreTranslate draft aid, always reviewed by the configured translation provider:
# auxiliary_url = "http://127.0.0.1:5000"

[reading]
enabled = true
max_links_per_article = 4
max_documents = 24
concurrency = 2
refresh_hours = 24
revision = "reading-zh-v1"
# Only original-source links and verified named destinations are read; no recursive crawling.
# [reading.mention_catalog]
# "An explicitly named app" = "https://its-verified-official-site.example/"

[discovery]
enabled = true
freshness_enabled = true
max_wait_minutes = 60
max_age_hours = 24
max_candidates_per_day = 200
max_calls_per_day = 200
max_calls_per_hour = 40
max_tokens_per_day = 2000000
max_calls_per_candidate = 2
batch_size = 4
session_reuse = true
session_directory = "./data/agent-sessions"
session_max_turns = 32
session_max_age_hours = 168
max_auto_watches = 6
max_new_watches_per_day = 2
trial_days = 7
# Inherits [provider]; override via [discovery.provider] to change the model/CLI.
# Predictions retain original engagement and are labelled separately from popularity.

[industry]
enabled = true
collect_minutes = 30
lookback_days = 90
max_items_per_source = 12
analysis_enabled = true
analysis_hours = 24
max_evidence = 12
max_evidence_chars = 36000
max_calls_per_day = 12
max_snapshots_per_theme_per_day = 1
# Free source access; model stages use the existing provider and a separate daily budget.

[research]
hf_enabled = true
arxiv_enabled = true
refresh_minutes = 30
hf_limit = 8
hf_min_upvotes = 10
arxiv_limit = 4
arxiv_candidates = 60
# HF votes measure community interest, not peer review or scientific validity.
# Keep original paper dates; older recommendations are not relabelled as new papers.

[[feeds]]
id = "openai"
name = "OpenAI News"
url = "https://openai.com/news/rss.xml"
authority = 2.0

[[feeds]]
id = "google-ai"
name = "Google AI"
url = "https://blog.google/technology/ai/rss/"
authority = 2.0

[[feeds]]
id = "deepmind"
name = "Google DeepMind"
url = "https://deepmind.google/blog/rss.xml"
authority = 2.0

[[feeds]]
id = "huggingface"
name = "Hugging Face"
url = "https://huggingface.co/blog/feed.xml"
authority = 1.5

[[feeds]]
id = "meta-newsroom"
name = "Meta Newsroom"
url = "https://about.fb.com/feed/"
authority = 2.0

[chat]
enabled = true
state_directory = "/var/lib/ai-radar/chat"
timeout_seconds = 300
max_pending = 8
queue_minutes = 15
max_turns_per_day = 100
