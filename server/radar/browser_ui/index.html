<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>网页授权 · 前沿</title><link rel="stylesheet" href="/v1/browser/assets/viewer.css"></head>
<body>
<header><span class="eyebrow">前沿 / 网页授权</span><strong id="domain">正在连接…</strong><span id="time"></span></header>
<p id="status" role="status">登录状态将保存在专用浏览器中。完成登录或验证后，点击“验证并补采”。</p>
<main id="screen"></main>
<footer><div class="row"><button id="keyboard">键盘</button><button id="tab">下一输入框</button><button id="enter">回车</button></div>
<input id="input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="远程键盘输入" placeholder="在此输入，自动同步到选中的远程输入框" hidden>
<div class="row"><button id="close">关闭窗口</button><button id="finish" class="primary">验证并补采</button></div></footer>
<script type="module" src="/v1/browser/assets/viewer.js"></script>
</body></html>
